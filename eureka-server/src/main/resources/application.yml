server:
  port: 8761

spring:
  application:
    name: eureka-server

  config:
    import: "optional:configserver:"

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
#      defaultZone: http://localhost:8761/eureka
    register-with-eureka: false
    fetch-registry: false