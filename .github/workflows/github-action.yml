name: GitHub Actions Demo
run-name: github action demo
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - develop
      - feature/ci-cd

jobs:
  build:
    name: Build and test services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      - name: Build with maven
        run: make package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up make
        run: sudo apt-get install make

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Проверка переменных окружения
        run: |
          if [ -z "${{ secrets.SSH_GIT_PRIVATE_KEY }}" ]; then
            echo "SSH_GIT_PRIVATE_KEY не установлен"
            exit 1
          fi

      - name: Debug Docker Compose Configuration
        run: docker-compose config

      - name: Build docker-compose container
        run: make up GIT_URI=${{ secrets.GIT_URI }} SSH_GIT_PRIVATE_KEY=${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Compose Logs
        if: failure()
        run: docker-compose logs
