services:
  database:
    image: postgres:17-alpine
    expose:
      - "5432"
    restart: on-failure:5
    volumes:
      - ./scripts/initdb.sql:/docker-entrypoint-initdb.d/init_db.sql
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1111}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      retries: 5
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-postgres@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-1111}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    expose:
      - "8888"
    volumes:
      - config-date:/tmp
    environment:
      GIT_URI: ${GIT_URI}
      SSH_GIT_PRIVATE_KEY: ${SSH_GIT_PRIVATE_KEY}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget http://localhost:8888/actuator/health" ]
      start_period: 15s
      interval: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - backend
    depends_on:
      config-server:
        condition: service_healthy
      database:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    container_name: auth-service
    networks:
      - backend
    depends_on:
      config-server:
        condition: service_healthy
      database:
        condition: service_healthy

  book-service:
    build: ./book-service
    container_name: book-service
    networks:
      - backend
    depends_on:
      config-server:
        condition: service_healthy
      database:
        condition: service_healthy

  library-service:
    build: ./library-service
    container_name: library-service
    networks:
      - backend
    depends_on:
      config-server:
        condition: service_healthy
      database:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    container_name: api-gateway
    networks:
      - backend
    depends_on:
      config-server:
        condition: service_healthy
      database:
        condition: service_healthy
      auth-service:
        condition: service_started
      library-service:
        condition: service_started
      book-service:
        condition: service_started

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "echo", "ruok", "|", "nc", "localhost", "2181", "|", "grep", "imok" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy


volumes:
  postgres-data:
  pgadmin-data:
  config-date:

networks:
  backend:
    driver: bridge
