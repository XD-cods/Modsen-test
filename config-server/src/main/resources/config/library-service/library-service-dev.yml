server:
  port: 0

spring:
  datasource:
    username: postgres
    password: 1111
    url: jdbc:postgresql://localhost:5432/postgres

openapi:
  service:
    title: library-service doc
springdoc:
  openapi:
    service:
      version: 1.0.0
      url: http://localhost:8080/
  api-docs:
    path: /api/record/v3/api-docs
  swagger-ui:
    path: /api/record/swagger-ui.html

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
