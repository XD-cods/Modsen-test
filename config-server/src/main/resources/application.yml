server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
        git:
          clone-on-start: true
          uri: ${GIT_URI}
          private-key: ${SSH_GIT_PRIVATE_KEY}
          ignore-local-ssh-settings: true


eureka:
  client:
    register-with-eureka: false
    fetch-registry: false